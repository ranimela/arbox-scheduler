name: Arbox Scheduler Agent

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Morning & Afternoon Staggered Triggers (UTC)
    # Uses off-peak minutes (:17 and :47) to bypass top-of-hour GitHub queue congestion
    # and absorb scheduling delays from 0 minutes up to 9 hours:
    # Summer (UTC+3, 21:00 ISR = 18:00 UTC) / Winter (UTC+2, 21:00 ISR = 19:00 UTC):
    - cron: '47 8 * * *'  # 11:47 Israel Summer / 10:47 Israel Winter (Absorbs up to 9h delay)
    - cron: '17 9 * * *'  # 12:17 Israel Summer / 11:17 Israel Winter (Absorbs up to 8.5h delay)
    - cron: '47 9 * * *'  # 12:47 Israel Summer / 11:47 Israel Winter (Absorbs up to 8h delay)
    - cron: '17 10 * * *' # 13:17 Israel Summer / 12:17 Israel Winter (Absorbs up to 7.5h delay)
    - cron: '47 10 * * *' # 13:47 Israel Summer / 12:47 Israel Winter (Absorbs up to 7h delay)
    - cron: '17 11 * * *' # 14:17 Israel Summer / 13:17 Israel Winter (Absorbs up to 6.5h delay)
    - cron: '47 11 * * *' # 14:47 Israel Summer / 13:47 Israel Winter (Absorbs up to 6h delay)
    - cron: '17 12 * * *' # 15:17 Israel Summer / 14:17 Israel Winter (Absorbs up to 5.5h delay)
    - cron: '47 12 * * *' # 15:47 Israel Summer / 14:47 Israel Winter (Absorbs up to 5h delay)
    - cron: '17 13 * * *' # 16:17 Israel Summer / 15:17 Israel Winter (Absorbs up to 4.5h delay)
    - cron: '47 13 * * *' # 16:47 Israel Summer / 15:47 Israel Winter (Absorbs up to 4h delay)
    - cron: '17 14 * * *' # 17:17 Israel Summer / 16:17 Israel Winter (Absorbs up to 3.5h delay)
    - cron: '47 14 * * *' # 17:47 Israel Summer / 16:47 Israel Winter (Absorbs up to 3h delay)
    - cron: '17 15 * * *' # 18:17 Israel Summer / 17:17 Israel Winter (Absorbs up to 2.5h delay)
    - cron: '47 15 * * *' # 18:47 Israel Summer / 17:47 Israel Winter (Absorbs up to 2h delay)
    - cron: '17 16 * * *' # 19:17 Israel Summer / 18:17 Israel Winter (Absorbs up to 1.5h delay)
    - cron: '47 16 * * *' # 19:47 Israel Summer / 18:47 Israel Winter (Absorbs up to 1h delay)
    - cron: '17 17 * * *' # 20:17 Israel Summer / 19:17 Israel Winter (Absorbs up to 30m delay)
    - cron: '47 17 * * *' # 20:47 Israel Summer / 19:47 Israel Winter (Absorbs up to 10m delay)
    - cron: '17 18 * * *' # 21:17 Israel Summer (exits immediately) / 20:17 Israel Winter
    - cron: '47 18 * * *' # 21:47 Israel Summer (exits immediately) / 20:47 Israel Winter
  
  workflow_dispatch:

jobs:
  run-arbox-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Arbox Scheduler Agent
        env:
          ARBOX_BOX_ID: ${{ secrets.ARBOX_BOX_ID }}
          ARBOX_LOCATION_ID: ${{ secrets.ARBOX_LOCATION_ID }}
          ARBOX_EMAIL: ${{ secrets.ARBOX_EMAIL }}
          ARBOX_PASSWORD: ${{ secrets.ARBOX_PASSWORD }}
          ARBOX_USER_ID: ${{ secrets.ARBOX_USER_ID }}
          ARBOX_MEMBERSHIP_USER_ID: ${{ secrets.ARBOX_MEMBERSHIP_USER_ID }}
          ARBOX_NTFY_TOPIC: ${{ secrets.ARBOX_NTFY_TOPIC }}
          TARGET_DAYS: ${{ vars.TARGET_DAYS }}
          TARGET_HOUR: ${{ vars.TARGET_HOUR }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python fetch_schedule.py

      - name: Send Run Failure Alert via ntfy
        if: failure()
        run: |
          curl -H "Title: ❌ Arbox Workflow Failed" \
               -H "Priority: high" \
               -H "Tags: warning,github" \
               -d "The Arbox Scheduler workflow run has failed. Check run logs for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               https://ntfy.sh/${{ secrets.ARBOX_NTFY_TOPIC || 'arbox-scheduler-ranimela' }}
